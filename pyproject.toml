[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qaas"
version = "1.0.0a0"
description = "Quantum-as-a-Service utilizing IQMProvider, IQMBackend, IQMJob and HEAppE. Developed by IT4Innovations."
authors = [
    { name="Jan Swiatkowski", email="jan.swiatkowski@vsb.cz" },
    { name="Jakub Konvička", email="jakub.konvicka@vsb.cz" },
    { name="Jan Martinovič", email="jan.martinovic@vsb.cz" },
    { name="Ladislav Foltyn", email="ladislav.foltyn@vsb.cz" }
]
readme = "README.rst"
requires-python = ">=3.12, <3.13"

# --- Base Dependencies (Client Always installed) ---
dependencies = [
    #"qiskit_aer>=0.15.0,<1.0.0",
    "aiohttp==3.14.*",
    "Py4HEAppE==3.1.*",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "cffi>=1.17.1",
    "click>=8.1.7",
    "jwcrypto==1.5.*",
    "PyJWT[crypto]==2.10.*",
    "numpy>2.0.0",
    "truststore",
    "qiskit_qasm3_import",
    "symengine",
    "py4lexis==7.1.*"
]

# --- Optional Subpackages (Extras) ---
[project.optional-dependencies]
iqm_qiskit = [
    "qiskit>=2.0,<2.2",
    "iqm-client[qiskit]==35.0.*",
    "iqm-exa-common==28.0.*",
    "iqm-station-control-client==13.0.*",
    "iqm-data-definitions==3.0",
    "protobuf<7.0",
]
iqm_pulla = [
    "iqm-pulla==14.0.*",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.uv.sources]
python-http-irods-client = { git = "https://opencode.it4i.eu/lexis-platform/data/python-http-irods-client.git", rev = "1.1.4" }