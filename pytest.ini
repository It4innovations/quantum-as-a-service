[pytest]
env_files = .env
testpaths = tests
timeout = 900
timeout_method = signal
markers =
    integration: live tests against LEXIS/HEAppE (need LEXIS_TOKEN, QHEAPPE_PROJECT, QHEAPPE_RESOURCE)
    qpu: submits jobs and consumes allocation
    known_issue: documents a confirmed defect (xfail); some may hang until their timeout
