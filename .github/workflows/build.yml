name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish docs by hand:
  #  - a docs fix for the current release: run from the branch, pick the channel;
  #  - docs of an existing tag (also tags from before versioned docs): set "tag",
  #    e.g. v1.0.0. That tag's sources are built with this workflow and published
  #    to its own release folder (and to the channel, unless "none").
  #    Docs exist for v1.0.0a1 and later only (the qheappe_client API).
  workflow_dispatch:
    inputs:
      docs_channel:
        description: 'Docs channel to publish to (none = release folder only, needs a tag)'
        type: choice
        options: [latest, pre, none]
        default: latest
      tag:
        description: 'Tag to build and publish docs for, e.g. v1.0.0 (empty = the selected branch/tag)'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------------------
  # 1) Check & Build
  # ---------------------------------------------------------------------------
  check-and-build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Manual runs only publish docs, possibly of an older tag: skip the checks
      # its sources were never held to (they ran when the tag was pushed).
      - name: Check spelling (typos)
        if: github.event_name != 'workflow_dispatch'
        uses: crate-ci/typos@v1

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Lint with ruff
        if: github.event_name != 'workflow_dispatch'
        run: uvx ruff check .

      - name: Check formatting with ruff
        if: github.event_name != 'workflow_dispatch'
        run: uvx ruff format --check .

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 2) Tests — depends on check-and-build
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: check-and-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package into clean environment
        run: pip install "$(ls dist/*.whl)[iqm_qiskit]" --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple

      # Only the new qheappe_client; the legacy qaas client needs iqm35_qiskit.
      - name: Smoke test — import check
        run: |
          python -c "
          from qheappe_client import QProvider, QBackendIQMFactory
          print('qheappe_client import OK, IQM stack:', QBackendIQMFactory.installed_stack())
          "

  # ---------------------------------------------------------------------------
  # 3) Build Documentation — depends on check-and-build
  #    Also decides where the docs go (published by deploy-doc):
  #      v* tag, stable version (v1.2.0)       -> 1.2.0/   + latest/ (default page)
  #      v* tag, pre-release (v1.2.0a1, rc1)   -> 1.2.0a1/ + pre/
  #      manual run with a tag                 -> <release>/ + chosen channel (or none)
  #      manual run without a tag              -> chosen channel
  #      push to main / PR                     -> build only, not published
  #    Only versions from 1.0 on are published; earlier tags have no qheappe_client.
  # ---------------------------------------------------------------------------
  build-doc:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: check-and-build
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      release: ${{ steps.channel.outputs.release }}
      versioned: ${{ steps.channel.outputs.versioned }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package and doc tools
        # API docs cover the new qheappe_client only; the legacy qaas client needs
        # iqm-client 35 (iqm35_qiskit) and does not import with iqm_qiskit.
        run: pip install "$(ls dist/*.whl)[iqm_qiskit]" zensical pdoc packaging --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple

      - name: Decide docs channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_CHANNEL: ${{ inputs.docs_channel }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          release=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          prerelease=$(python -c "from packaging.version import Version; print(str(Version('$release').is_prerelease).lower())")

          # The tag being built, if any: a pushed tag, the "tag" input, or a manual
          # run started from a tag. Every tag gets its own release folder.
          tag=""
          if [[ "$REF" == refs/tags/v* ]]; then tag="${REF#refs/tags/}"; fi
          if [ -n "$DISPATCH_TAG" ]; then tag="$DISPATCH_TAG"; fi
          major=$(python -c "from packaging.version import Version; print(Version('$release').major)")
          if [ -n "$tag" ] && [ "$major" -lt 1 ]; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::error::Docs are published for v1.0.0a1 and later only; $tag is older."
              exit 1
            fi
            echo "::notice::$tag is older than v1; its docs are not published."
            tag=""
          fi
          versioned=false
          if [ -n "$tag" ]; then
            versioned=true
            if [ "$(python -c "from packaging.version import Version; print(Version('${tag#v}'))")" != "$(python -c "from packaging.version import Version; print(Version('$release'))")" ]; then
              echo "::error::Tag $tag does not match the package version $release in pyproject.toml."
              exit 1
            fi
          fi

          channel=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            channel="$DISPATCH_CHANNEL"
            if [ "$channel" = "none" ]; then channel=""; fi
          elif [ "$EVENT" = "push" ] && [ -n "$tag" ]; then
            if [ "$prerelease" = "true" ]; then channel=pre; else channel=latest; fi
          fi
          if [ "$channel" = "latest" ] && [ "$prerelease" = "true" ]; then
            echo "::error::Version $release is a pre-release; it cannot be published as latest (stable) docs."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ -z "$channel" ] && [ "$versioned" = "false" ]; then
            echo "::error::Channel 'none' needs a tag: set the 'tag' input or run from a tag."
            exit 1
          fi

          targets="${channel:+$channel/}"
          if [ "$versioned" = "true" ]; then targets="$release/ ${targets}"; fi
          echo "Docs for $release -> ${targets:-not published}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "versioned=$versioned" >> "$GITHUB_OUTPUT"

      - name: Build Zensical documentation
        # MIKE_DOCS_VERSION makes canonical URLs and the sitemap point into the
        # channel folder (e.g. .../latest/).
        run: zensical build --clean
        env:
          MIKE_DOCS_VERSION: ${{ steps.channel.outputs.channel || steps.channel.outputs.release }}

      - name: Build pdoc API reference
        # Generates HTML into site/api_reference/ alongside the Zensical output.
        # Link to it from docs/api.md, e.g.: [Full API Reference](../api_reference/qheappe_client.html)
        run: pdoc --output-dir site/api_reference qheappe_client
        env:
          CYCLOPS_API_URL: "http://placeholder"
          CYCLOPS_KAFKA_SERVER: "placeholder:9092"
          QAAS_INTERNAL_ACCOUNTING_DB_URI: "postgresql://user_placeholder:example_pwd@localhost/database_name"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  # ---------------------------------------------------------------------------
  # 4) Deploy Documentation — depends on tests + build-doc
  #    Runs when build-doc picked a channel or a release folder. The gh-pages
  #    branch keeps the channels (latest/, pre/) and one folder per tagged
  #    release (1.1.0a1/, ...); this job updates them and deploys the whole
  #    tree. See scripts/publish_docs.py.
  # ---------------------------------------------------------------------------
  deploy-doc:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [tests, build-doc]
    if: needs.build-doc.outputs.channel != '' || needs.build-doc.outputs.versioned == 'true'
    # Only one Pages deployment at a time, so gh-pages updates never race.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: write   # push to the gh-pages branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}latest/
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git worktree add gh-pages origin/gh-pages
          else
            # First run: start an empty branch with no history.
            git worktree add --orphan -b gh-pages gh-pages
          fi

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge site into gh-pages
        run: |
          pip install packaging
          python scripts/publish_docs.py \
            --site site --pages gh-pages \
            --channel "${{ needs.build-doc.outputs.channel || 'none' }}" \
            --release "${{ needs.build-doc.outputs.release }}" \
            ${{ needs.build-doc.outputs.versioned == 'true' && '--versioned' || '' }} \
            --base-path "/${{ github.event.repository.name }}/"

      - name: Push gh-pages branch
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: publish ${{ needs.build-doc.outputs.release }} (channel: ${{ needs.build-doc.outputs.channel || 'none' }}, release folder: ${{ needs.build-doc.outputs.versioned }}) (${{ github.sha }})" || echo "No changes"
          git push origin HEAD:refs/heads/gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 5) Release — depends on deploy-doc
  #    Runs only when a v* tag is pushed (not for manual docs runs from a tag)
  # ---------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: deploy-doc
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create a GitHub Release
      id-token: write   # needed for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
