name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Publish docs by hand, e.g. a docs fix for the current stable release.
  # Pick the branch/tag in "Use workflow from"; its docs go to the chosen channel.
  workflow_dispatch:
    inputs:
      docs_channel:
        description: 'Docs channel to publish to'
        type: choice
        options: [stable, pre]
        default: stable

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ---------------------------------------------------------------------------
  # 1) Check & Build
  # ---------------------------------------------------------------------------
  check-and-build:
    name: Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check spelling (typos)
        uses: crate-ci/typos@v1

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: false

      - name: Lint with ruff
        run: uvx ruff check .

      - name: Check formatting with ruff
        run: uvx ruff format --check .

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # 2) Tests — depends on check-and-build
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: check-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package into clean environment
        run: pip install "$(ls dist/*.whl)[iqm_qiskit]" --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple

      # Only the new qheappe_client; the legacy qaas client needs iqm35_qiskit.
      - name: Smoke test — import check
        run: |
          python -c "
          from qheappe_client import QProvider, QBackendIQMFactory
          print('qheappe_client import OK, IQM stack:', QBackendIQMFactory.installed_stack())
          "

  # ---------------------------------------------------------------------------
  # 3) Build Documentation — depends on check-and-build
  #    Also decides where the docs go (published by deploy-doc):
  #      v* tag, stable version (v1.2.0)       -> stable/  (default page)
  #      v* tag, pre-release (v1.2.0a1, rc1)   -> pre/
  #      manual run (workflow_dispatch)        -> chosen channel
  #      push to main / PR                     -> build only, not published
  # ---------------------------------------------------------------------------
  build-doc:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: check-and-build
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      release: ${{ steps.channel.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install package and doc tools
        # API docs cover the new qheappe_client only; the legacy qaas client needs
        # iqm-client 35 (iqm35_qiskit) and does not import with iqm_qiskit.
        run: pip install "$(ls dist/*.whl)[iqm_qiskit]" zensical pdoc packaging --extra-index-url https://opencode.it4i.eu/api/v4/projects/107/packages/pypi/simple

      - name: Decide docs channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_CHANNEL: ${{ inputs.docs_channel }}
        run: |
          release=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          prerelease=$(python -c "from packaging.version import Version; print(str(Version('$release').is_prerelease).lower())")
          channel=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            channel="$DISPATCH_CHANNEL"
          elif [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            if [ "$prerelease" = "true" ]; then channel=pre; else channel=stable; fi
          fi
          if [ "$channel" = "stable" ] && [ "$prerelease" = "true" ]; then
            echo "::error::Version $release is a pre-release; it cannot be published as stable docs."
            exit 1
          fi
          echo "Docs for $release -> ${channel:-not published}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build Zensical documentation
        # MIKE_DOCS_VERSION makes canonical URLs and the sitemap point into the
        # channel folder (e.g. .../stable/).
        run: zensical build --clean
        env:
          MIKE_DOCS_VERSION: ${{ steps.channel.outputs.channel }}

      - name: Build pdoc API reference
        # Generates HTML into site/api_reference/ alongside the Zensical output.
        # Link to it from docs/api.md, e.g.: [Full API Reference](../api_reference/qheappe_client.html)
        run: pdoc --output-dir site/api_reference qheappe_client
        env:
          CYCLOPS_API_URL: "http://placeholder"
          CYCLOPS_KAFKA_SERVER: "placeholder:9092"
          QAAS_INTERNAL_ACCOUNTING_DB_URI: "postgresql://user_placeholder:example_pwd@localhost/database_name"

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  # ---------------------------------------------------------------------------
  # 4) Deploy Documentation — depends on tests + build-doc
  #    Runs only when build-doc picked a channel. The gh-pages branch keeps
  #    every channel (stable/, pre/); this job replaces one of them and
  #    deploys the whole tree. See scripts/publish_docs.py.
  # ---------------------------------------------------------------------------
  deploy-doc:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [tests, build-doc]
    if: needs.build-doc.outputs.channel != ''
    # Only one Pages deployment at a time, so gh-pages updates never race.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: write   # push to the gh-pages branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}stable/
    steps:
      - uses: actions/checkout@v4

      - name: Check out gh-pages branch
        run: |
          git fetch origin gh-pages --depth=1 || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git worktree add gh-pages origin/gh-pages
          else
            # First run: start an empty branch with no history.
            git worktree add --orphan -b gh-pages gh-pages
          fi

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge site into gh-pages
        run: |
          pip install packaging
          python scripts/publish_docs.py \
            --site site --pages gh-pages \
            --channel "${{ needs.build-doc.outputs.channel }}" \
            --release "${{ needs.build-doc.outputs.release }}" \
            --base-path "/${{ github.event.repository.name }}/"

      - name: Push gh-pages branch
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "docs: publish ${{ needs.build-doc.outputs.release }} to ${{ needs.build-doc.outputs.channel }}/ (${{ github.sha }})" || echo "No changes"
          git push origin HEAD:refs/heads/gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # 5) Release — depends on deploy-doc
  #    Runs only on a v* tag
  # ---------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: deploy-doc
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # needed to create a GitHub Release
      id-token: write   # needed for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
